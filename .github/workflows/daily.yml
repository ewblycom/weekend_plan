name: Events scrape

on:
  schedule:
    - cron: "17 4,16 * * *"   # дважды в сутки: ~5:17 и ~17:17 по Праге (cron в UTC)
  push:                       # изменили парсер/настройки — сразу пересобираем афиши
    paths:
      - "scraper/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуска

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Scrape
        run: python -m scraper.run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/data/events.json docs/data/places.json docs/data/food.json data/cache
          git diff --cached --quiet || git commit -m "data: события на $(date +%F)"
          git pull --rebase -q
          git push
